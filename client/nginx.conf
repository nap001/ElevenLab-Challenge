server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite emits content-hashed filenames, so they are safe to cache forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the entry document, so new deploys are picked up immediately.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: unknown paths are handled by the client-side app.
    location / {
        try_files $uri /index.html;
    }
}
